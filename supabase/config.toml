# Minimal Supabase config for the GitHub integration.
# project_id is a local label; the linked project is set in the Supabase dashboard.
project_id = "casario"

# Платёжные функции доступны и гостям (оплата до входа), поэтому JWT не требуем.
# Секреты задаются через `supabase secrets set ...` и НЕ хранятся в репозитории.
[functions.create-invoice]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false
